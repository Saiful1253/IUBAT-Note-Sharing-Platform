<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People - iShare IUBAT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="student-people.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <a href="#" class="topbar-logo">
                <div class="topbar-logo-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 9l10 7 10-7-10-7z"/><path d="M7 12l5 3.5 5-3.5"/><path d="M12 16v4"/><circle cx="12" cy="21" r="1"/></svg>
                </div>
                <div>
                    <div class="topbar-logo-text">iShare</div>
                    <div class="topbar-logo-badge">IUBAT</div>
                </div>
            </a>
        </div>
        <div class="topbar-center">
            <div class="topbar-search-wrapper">
                <svg class="topbar-search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="topbar-search" placeholder="Search notes, slides, course codes (e.g. CSE321)...">
            </div>
        </div>
        <div class="topbar-actions">
            <button class="topbar-ai-btn" type="button">
                <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><path d="M12 6v6l4 2"/></svg>
                Gemma 3 AI
            </button>
            <div class="notification-wrapper" id="notificationWrapper">
                <button class="topbar-icon-btn" id="notificationBtn" title="Notifications" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                    <span class="topbar-badge" id="notificationBadge" style="display:none;">0</span>
                </button>
                <div class="notification-dropdown" id="notificationDropdown">
                    <div class="notification-header">
                        <h3>Notifications</h3>
                        <div class="notification-header-actions">
                            <button class="mark-all-read" id="markAllRead" type="button">Mark all as read</button>
                            <button class="delete-all" id="deleteAllNotifications" type="button">Delete all</button>
                        </div>
                    </div>
                    <div class="notification-list" id="notificationList">
                        <div class="notification-empty">No notifications yet.</div>
                    </div>
                </div>
            </div>
            <div class="topbar-avatar" id="studentAvatar" title="My Profile">S</div>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-profile">
                <div class="sidebar-profile-card">
                    <div class="sidebar-avatar" id="sidebarAvatar">S</div>
                    <div class="sidebar-profile-info">
                        <div class="sidebar-profile-name" id="sidebarName">Student</div>
                        <div class="sidebar-profile-dept" id="sidebarDept">Student</div>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item" type="button" onclick="window.location.href='student-home.html'">
                    <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
                    Home
                </button>
                <button class="nav-item active" type="button" onclick="window.location.href='student-people.html'">
                    <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                    People
                </button>
                <button class="nav-item" type="button" onclick="window.location.href='student-messaging.html'">
                    <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
                    Messaging
                    <span class="nav-dot"></span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="sidebar-logout" type="button" id="sidebarLogoutBtn">
                    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Logout
                </button>
            </div>
        </aside>
        <main class="content">
            <div class="page-header">
                <h1 class="page-title">People</h1>
                <p class="page-subtitle">Connect with classmates and teachers from your department.</p>
            </div>
            <div class="people-grid" id="peopleGrid">
                <div class="people-card">
                    <div class="people-avatar">ST</div>
                    <div class="people-info">
                        <div class="people-name">Student Teacher</div>
                        <div class="people-meta">Department of CSE</div>
                    </div>
                    <div class="people-status"></div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <div class="modal-overlay" id="profileModal">
        <div class="modal-card profile-modal">
            <div class="modal-header">
                <div class="modal-title">My Profile</div>
                <button class="modal-close" id="closeProfileModal" type="button">&times;</button>
            </div>
            <div class="modal-body profile-modal-body">
                <div class="profile-avatar" id="profileModalAvatar">S</div>
                <div class="profile-name" id="profileModalName">Student</div>
                <div class="profile-dept" id="profileModalDept">Student</div>

                <div class="profile-details">
                    <div class="profile-detail-item">
                        <span class="profile-detail-label">Student ID</span>
                        <span class="profile-detail-value" id="profileModalStudentId">-</span>
                    </div>
                    <div class="profile-detail-item">
                        <span class="profile-detail-label">Department</span>
                        <span class="profile-detail-value" id="profileModalDeptDetail">-</span>
                    </div>
                    <div class="profile-detail-item">
                        <span class="profile-detail-label">Account Type</span>
                        <span class="profile-detail-value" id="profileModalType">-</span>
                    </div>
                    <div class="profile-detail-item">
                        <span class="profile-detail-label">Email</span>
                        <span class="profile-detail-value" id="profileModalEmail">-</span>
                    </div>
                </div>

                <div class="profile-stats">
                    <div class="profile-stat">
                        <span class="profile-stat-value" id="profileModalNotes">0</span>
                        <span class="profile-stat-label">Notes Posted</span>
                    </div>
                    <div class="profile-stat">
                        <span class="profile-stat-value" id="profileModalDownloads">0</span>
                        <span class="profile-stat-label">Downloads</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'ishare_announcements';
        const NOTES_KEY = 'ishare_notes';
        const DEPT_KEY = 'ishare_departments';
        const NOTIF_KEY = 'ishare_notifications';

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const diff = Date.now() - timestamp;
            const minutes = Math.floor(diff / 60000);
            if (minutes < 1) return 'Just now';
            if (minutes < 60) return minutes + 'm ago';
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return hours + 'h ago';
            const days = Math.floor(hours / 24);
            if (days < 7) return days + 'd ago';
            return new Date(timestamp).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function getAnnouncements() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
        }

        function getNotes() {
            try { return JSON.parse(localStorage.getItem(NOTES_KEY) || '[]'); } catch { return []; }
        }

        function getDepartments() {
            try { return JSON.parse(localStorage.getItem(DEPT_KEY) || '[]'); } catch { return []; }
        }

        function getUserDownloads() {
            try { return parseInt(localStorage.getItem('ishare_user_downloads') || '0', 10); } catch { return 0; }
        }

        function getUserNotes() {
            const notes = getNotes();
            const userId = localStorage.getItem('ishare_user_id');
            return notes.filter(function(n) { return n.authorId === userId; });
        }

        function showToast(message, type) {
            type = type || 'success';
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            setTimeout(function() { toast.classList.add('show'); }, 10);
            setTimeout(function() { toast.classList.remove('show'); }, 3500);
        }

        function getNotifications() {
            try { return JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]'); } catch { return []; }
        }

        function saveNotifications(notifications) {
            localStorage.setItem(NOTIF_KEY, JSON.stringify(notifications));
        }

        function updateBadge() {
            const notifications = getNotifications();
            const unreadCount = notifications.filter(n => !n.read).length;
            const badge = document.getElementById('notificationBadge');
            if (unreadCount > 0) {
                badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
                badge.style.display = 'inline-flex';
            } else {
                badge.style.display = 'none';
            }
        }

        function renderNotifications() {
            const notifications = getNotifications();
            const listEl = document.getElementById('notificationList');
            if (notifications.length === 0) {
                listEl.innerHTML = '<div class="notification-empty">No notifications yet.</div>';
                return;
            }
            const iconMap = { system: '&#9881;', user: '&#128100;', alert: '&#9888;', info: '&#8505;' };
            listEl.innerHTML = notifications.slice(0, 20).map(n => {
                return '<div class="notification-item ' + (n.read ? '' : 'unread') + '" data-id="' + n.id + '">' +
                    '<div class="notification-icon ' + (n.type || 'system') + '">' + (iconMap[n.type] || '&#128276;') + '</div>' +
                    '<div class="notification-body">' +
                        '<div class="notification-title">' + escapeHtml(n.title) + '</div>' +
                        '<div class="notification-message">' + escapeHtml(n.message) + '</div>' +
                        '<div class="notification-time">' + formatTime(n.time) + '</div>' +
                    '</div>' +
                    '<button class="notification-delete" data-id="' + n.id + '" title="Delete notification">' +
                        '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
                    '</button>' +
                '</div>';
            }).join('');

            listEl.querySelectorAll('.notification-item').forEach(function(item) {
                item.addEventListener('click', function(e) {
                    if (e.target.closest('.notification-delete')) return;
                    const id = this.getAttribute('data-id');
                    const notifs = getNotifications();
                    const target = notifs.find(n => n.id === id);
                    if (target && !target.read) {
                        target.read = true;
                        saveNotifications(notifs);
                        updateBadge();
                        this.classList.remove('unread');
                    }
                });
            });

            listEl.querySelectorAll('.notification-delete').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.getAttribute('data-id');
                    const notifs = getNotifications().filter(n => n.id !== id);
                    saveNotifications(notifs);
                    updateBadge();
                    renderNotifications();
                });
            });
        }

        function generateDemoNotifications() {
            const accounts = JSON.parse(localStorage.getItem('ishare_accounts') || '[]');
            const notifications = [];
            const now = Date.now();

            notifications.push({
                id: 'welcome-' + Date.now(),
                title: 'Welcome to iShare!',
                message: 'Explore notes from your department and upload your own to help classmates.',
                type: 'info',
                time: now,
                read: false
            });

            accounts.slice(0, 2).forEach(function(acc, index) {
                notifications.push({
                    id: 'system-' + acc.studentId + '-' + index,
                    title: 'New user registered',
                    message: acc.fullname + ' joined as ' + (acc.accountType || 'Student') + '.',
                    type: 'user',
                    time: now - 1000 * 60 * (5 + index * 10),
                    read: false
                });
            });

            if (notifications.length <= 1) {
                notifications.push({
                    id: 'system-1',
                    title: 'Platform ready',
                    message: 'iShare is ready. Browse notes and stay updated with announcements.',
                    type: 'system',
                    time: now - 1000 * 60 * 15,
                    read: false
                });
            }

            return notifications;
        }

        function ensureNotifications() {
            let notifications = getNotifications();
            if (notifications.length === 0) {
                notifications = generateDemoNotifications();
                saveNotifications(notifications);
            }
            return notifications;
        }

        function renderPeople() {
            const grid = document.getElementById('peopleGrid');
            const accounts = JSON.parse(localStorage.getItem('ishare_accounts') || '[]');
            const currentUserId = localStorage.getItem('ishare_user_id');
            const currentUserDept = localStorage.getItem('ishare_user_department');

            const people = accounts.filter(function(a) {
                return a.studentId !== currentUserId && a.department === currentUserDept;
            });

            if (people.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><div class="empty-state-title">No people found</div><div class="empty-state-desc">People will appear here once they register.</div></div>';
                return;
            }

            grid.innerHTML = people.map(function(p) {
                const initials = (p.fullname || 'U').split(' ').map(function(n) { return n[0]; }).join('').toUpperCase().slice(0, 2);
                return '<div class="people-card">' +
                    '<div class="people-avatar">' + initials + '</div>' +
                    '<div class="people-info">' +
                        '<div class="people-name">' + escapeHtml(p.fullname || 'Unknown') + '</div>' +
                        '<div class="people-meta">' + escapeHtml(p.department || 'N/A') + (p.accountType ? ' · ' + escapeHtml(p.accountType) : '') + '</div>' +
                    '</div>' +
                    '<div class="people-status" title="Active"></div>' +
                '</div>';
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', function() {
            const userId = localStorage.getItem('ishare_user_id');
            const userName = localStorage.getItem('ishare_user_name');
            const userType = localStorage.getItem('ishare_user_type');
            const userDept = localStorage.getItem('ishare_user_department');

            if (!userId || userType !== 'Student') {
                window.location.href = 'index.html';
                return;
            }

            if (userName) {
                const initials = userName.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
                const avatar = document.getElementById('studentAvatar');
                if (avatar) avatar.textContent = initials || 'S';
                const sidebarAvatar = document.getElementById('sidebarAvatar');
                if (sidebarAvatar) sidebarAvatar.textContent = initials || 'S';
                const sidebarName = document.getElementById('sidebarName');
                if (sidebarName) sidebarName.textContent = userName;
                const sidebarDept = document.getElementById('sidebarDept');
                if (sidebarDept) sidebarDept.textContent = (userDept || 'Student').slice(0, 25) + (userDept && userDept.length > 25 ? '..' : '');
            }

            const notificationWrapper = document.getElementById('notificationWrapper');
            const notificationBtn = document.getElementById('notificationBtn');
            const notificationDropdown = document.getElementById('notificationDropdown');
            const markAllReadBtn = document.getElementById('markAllRead');
            const deleteAllBtn = document.getElementById('deleteAllNotifications');

            if (notificationBtn) {
                notificationBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const isShown = notificationDropdown.classList.contains('show');
                    if (isShown) {
                        notificationDropdown.classList.remove('show');
                    } else {
                        renderNotifications();
                        notificationDropdown.classList.add('show');
                    }
                });
            }

            if (markAllReadBtn) {
                markAllReadBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const notifs = getNotifications();
                    let changed = false;
                    notifs.forEach(n => { if (!n.read) { n.read = true; changed = true; } });
                    if (changed) {
                        saveNotifications(notifs);
                        updateBadge();
                        renderNotifications();
                    }
                });
            }

            if (deleteAllBtn) {
                deleteAllBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (confirm('Delete all notifications? This cannot be undone.')) {
                        saveNotifications([]);
                        updateBadge();
                        renderNotifications();
                    }
                });
            }

            document.addEventListener('click', function(e) {
                if (notificationWrapper && !notificationWrapper.contains(e.target)) {
                    notificationDropdown.classList.remove('show');
                }
            });

            function closeProfileModal() {
                const modal = document.getElementById('profileModal');
                if (modal) modal.classList.remove('show');
            }

            function openProfileModal() {
                const modal = document.getElementById('profileModal');
                if (!modal) return;

                const userName = localStorage.getItem('ishare_user_name') || 'Student';
                const userDept = localStorage.getItem('ishare_user_department') || '';
                const userId = localStorage.getItem('ishare_user_id') || '';
                const userType = localStorage.getItem('ishare_user_type') || 'Student';

                const accounts = JSON.parse(localStorage.getItem('ishare_accounts') || '[]');
                const account = accounts.find(function(a) { return a.studentId === userId; });
                const userEmail = account ? account.email : '';

                const initials = userName.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

                const avatarEl = document.getElementById('profileModalAvatar');
                if (avatarEl) avatarEl.textContent = initials || 'S';

                const nameEl = document.getElementById('profileModalName');
                if (nameEl) nameEl.textContent = userName;

                const deptEl = document.getElementById('profileModalDept');
                if (deptEl) deptEl.textContent = (userDept || 'Student').slice(0, 30);

                const studentIdEl = document.getElementById('profileModalStudentId');
                if (studentIdEl) studentIdEl.textContent = userId || '-';

                const deptDetailEl = document.getElementById('profileModalDeptDetail');
                if (deptDetailEl) deptDetailEl.textContent = userDept || '-';

                const typeEl = document.getElementById('profileModalType');
                if (typeEl) typeEl.textContent = userType || '-';

                const emailEl = document.getElementById('profileModalEmail');
                if (emailEl) emailEl.textContent = userEmail || '-';

                const notesEl = document.getElementById('profileModalNotes');
                if (notesEl) notesEl.textContent = getUserNotes().length;

                const downloadsEl = document.getElementById('profileModalDownloads');
                if (downloadsEl) downloadsEl.textContent = getUserDownloads();

                modal.classList.add('show');
            }

            const studentAvatar = document.getElementById('studentAvatar');
            if (studentAvatar) {
                studentAvatar.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openProfileModal();
                });
            }

            const closeProfileModalBtn = document.getElementById('closeProfileModal');
            if (closeProfileModalBtn) {
                closeProfileModalBtn.addEventListener('click', closeProfileModal);
            }

            const profileModal = document.getElementById('profileModal');
            if (profileModal) {
                profileModal.addEventListener('click', function(e) {
                    if (e.target === profileModal) closeProfileModal();
                });
            }

            ensureNotifications();
            updateBadge();
            renderPeople();

            const logoutBtn = document.getElementById('sidebarLogoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (confirm('Are you sure you want to log out?')) {
                        localStorage.removeItem('ishare_user_id');
                        localStorage.removeItem('ishare_user_password');
                        localStorage.removeItem('ishare_user_type');
                        localStorage.removeItem('ishare_user_name');
                        localStorage.removeItem('ishare_user_department');
                        localStorage.removeItem('ishare_user_email');
                        localStorage.removeItem('ishare_user_downloads');
                        window.location.href = 'index.html';
                    }
                });
            }
        });
    </script>
</body>
</html>
