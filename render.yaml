services:
  - type: web
    name: iubat-note-sharing
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        value: localhost
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: ""
      - key: DB_NAME
        value: ishare_db
      - key: ADMIN_STUDENT_ID
        value: 123456
      - key: ADMIN_EMAIL
        value: admin@ishare.com
      - key: ADMIN_PASSWORD
        value: admin123
      - key: ADMIN_FULLNAME
        value: System Admin